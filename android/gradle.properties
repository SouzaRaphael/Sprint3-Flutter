org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# O caminho deste projeto contem um caractere acentuado ("3 ano"), e o Android
# Gradle Plugin bloqueia o build por precaucao. O build foi validado com este
# override ativo. Se preferir, mova o projeto para um caminho sem acentos e
# remova esta linha.
android.overridePathCheck=true
